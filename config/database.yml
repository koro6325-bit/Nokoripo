# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: db              # ← ここが「db」になっているか確認
  username: postgres
  password: password

development:
  <<: *default
  database: nokoripo_development

test:
  <<: *default
  database: nokoripo_test

production:
  <<: *default
  database: nokoripo_production
  username: nokoripo
  password: <%= ENV["NOKORIPO_DATABASE_PASSWORD"] %>

